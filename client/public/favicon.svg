<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <filter id="glow-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    :root {
      --bg: #070a10;
      --border: rgba(16, 185, 129, 0.4);
      --icon: #10b981;
      --glow: rgba(16, 185, 129, 0.15);
      --inner-cutout: #070a10;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --border: rgba(5, 150, 105, 0.35);
        --icon: #059669;
        --glow: rgba(5, 150, 105, 0.12);
        --inner-cutout: #ffffff;
      }
    }
  </style>

  <!-- Container Box -->
  <rect width="100" height="100" rx="24" fill="var(--bg)"/>
  <rect width="98" height="98" x="1" y="1" rx="23" stroke="var(--border)" stroke-width="2"/>
  <circle cx="50" cy="50" r="32" fill="var(--glow)"/>

  <!-- Geometric Z + Speech Bubble Emblem (Zeplyn) -->
  <g fill="var(--icon)">
    <!-- Top Horizontal bar & Speech Bubble Pointer -->
    <path d="M 22 24 L 64 24 L 78 18 L 72 34 L 78 34 L 78 40 L 64 40 L 64 33 L 42 33 L 64 61 L 78 61 L 78 76 L 22 76 L 22 67 L 56 67 L 34 39 L 22 39 Z"/>
  </g>
</svg>